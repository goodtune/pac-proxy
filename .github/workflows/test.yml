name: Test

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      # internal/logging uses log/syslog, so Windows is not a target; this
      # keeps the macOS release builds from breaking unnoticed.
      - name: Cross-compile (darwin)
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/pac-proxy
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/pac-proxy

      - name: Build binary
        run: CGO_ENABLED=0 go build -o pac-proxy ./cmd/pac-proxy

      - name: Verify binary runs
        run: ./pac-proxy -version

      - name: Verify packaged systemd unit
        run: |
          sudo install -m 0755 ./pac-proxy /usr/bin/pac-proxy
          # Ubuntu has no /etc/sysconfig; the unit's EnvironmentFile needs it.
          sudo mkdir -p /etc/sysconfig
          sudo install -m 0644 packaging/pac.sysconfig /etc/sysconfig/pac
          systemd-analyze verify packaging/pac-proxy.service

  goreleaser-check:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Builds every archive and package without publishing, so a broken
      # .goreleaser.yaml or package script fails here rather than on release.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --skip=publish
